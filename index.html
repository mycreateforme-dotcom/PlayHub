<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayHub - Online Games</title>
  <style>
    :root {
      --bg: #0e1117;
      --card-bg: #1e2530;
      --sidebar-bg: #161b22;
      --primary: #ff4b4b;
      --text: #ffffff;
      --text-muted: #8b949e;
      --border: #30363d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; height: 100vh; background: var(--bg); color: var(--text); overflow: hidden; }

    #sidebar { width: 300px; background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--text-muted); }
    .form-group input, .form-group select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: #fff; }
    button { width: 100%; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: var(--primary); color: #fff; }
    button.secondary { background: var(--card-bg); border: 1px solid var(--border); margin-top: 8px; }
    button.save-btn { background: #238636; margin-top: 4px; }
    button.danger { background: #d73a49; }

    #main { flex: 1; padding: 24px; overflow-y: auto; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
    .metric-value { font-size: 1.5rem; font-weight: bold; color: var(--primary); }

    #player-section { margin-bottom: 24px; background: var(--card-bg); border-radius: 8px; padding: 16px; border: 1px solid var(--border); display: none; }
    .player-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .player-actions { display: flex; gap: 8px; }
    .player-actions button { width: auto; }
    iframe { width: 100%; height: 600px; border: none; border-radius: 6px; background: #000; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
    .icon { font-size: 2.5rem; }
    .title { font-size: 1rem; margin: 6px 0; }
    .plays { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; }
    .admin-actions { display: none; margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px; text-align: left; }
    .admin-actions label { font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 2px; }
    .admin-actions input { width: 100%; padding: 4px 6px; margin-bottom: 4px; background: var(--bg); color: #fff; border: 1px solid var(--border); border-radius: 4px; }
  </style>
</head>
<body>

  <aside id="sidebar">
    <h2 style="margin-bottom: 16px;">🎮 PlayHub Admin</h2>
    <div id="login-box">
      <div class="form-group"><label>Username</label><input type="text" id="user" /></div>
      <div class="form-group"><label>Password</label><input type="password" id="pass" /></div>
      <button onclick="login()">Log In</button>
    </div>

    <div id="admin-box" style="display: none;">
      <p style="color: #4ade80; margin-bottom: 8px;">🟢 Admin: Keshav</p>
      <button class="secondary" onclick="logout()">Log Out</button>
      <hr style="border-color: var(--border); margin: 16px 0;" />
      <h4 style="margin-bottom: 10px;">➕ Add New Game</h4>
      <div class="form-group"><label>Title</label><input type="text" id="g-title" /></div>
      <div class="form-group"><label>URL</label><input type="text" id="g-url" placeholder="https://..." /></div>
      <div class="form-group">
        <label>Icon</label>
        <select id="g-icon">
          <option>🎮</option><option>🚀</option><option>⚔️</option><option>🤖</option>
          <option>⚡</option><option>🏓</option><option>💥</option><option>🏄</option><option>🪐</option><option>♟️</option>
        </select>
      </div>
      <div class="form-group"><label>Initial Plays</label><input type="number" id="g-plays" value="0" min="0" /></div>
      <button onclick="addGame()">Publish Game</button>
      <button class="secondary" onclick="resetGames()">🔄 Reset to Defaults</button>
    </div>
  </aside>

  <main id="main">
    <div class="header">
      <div>
        <h1>🎮 PlayHub</h1>
        <p style="color: var(--text-muted);">Click any game to play directly in your browser.</p>
      </div>
      <div style="text-align: right;">
        <div>Total Plays</div>
        <div class="metric-value" id="total-count">0</div>
      </div>
    </div>

    <section id="player-section">
      <div class="player-header">
        <h3 id="player-name">Playing</h3>
        <div class="player-actions">
          <button class="secondary" onclick="openTab()">⤢ Full Tab</button>
          <button class="danger" onclick="closePlayer()">✕ Close</button>
        </div>
      </div>
      <iframe id="game-frame" src="" allow="camera; microphone; fullscreen; autoplay; display-capture" allowfullscreen></iframe>
    </section>

    <div class="grid" id="grid"></div>
  </main>

  <script>
    const INITIAL_GAMES = [
      {"id": "game_hand_gesture_slicer", "title": "Hand Gesture Slicer", "url": "https://mycreateforme-dotcom.github.io/Hand-Gesture-Slicer/", "icon": "🖐️", "plays": 480},
      {"id": "game_cfm", "title": "HYPERSPACE 3D", "url": "https://mycreateforme-dotcom.github.io/GameCFM/", "icon": "🚀", "plays": 310},
      {"id": "game_cyber_pong", "title": "Cyber Pong Overdrive", "url": "https://mycreateforme-dotcom.github.io/CYBER-PONG-OVERDRIVE/", "icon": "🏓", "plays": 215},
      {"id": "game_chess_adapt", "title": "Chess Adapt", "url": "https://mycreateforme-dotcom.github.io/Chess-Adapt-/", "icon": "♟️", "plays": 185},
      {"id": "game_cyber_force_3d", "title": "Cyber Force 3D", "url": "https://mycreateforme-dotcom.github.io/CYBER-FORCE3D/", "icon": "💥", "plays": 150},
      {"id": "game_cyber_glide", "title": "Cyber Glide", "url": "https://mycreateforme-dotcom.github.io/CYBER-GLIDE/", "icon": "🏄", "plays": 125},
      {"id": "game_space_conquest", "title": "Space Conquest", "url": "https://mycreateforme-dotcom.github.io/Space-Conquest/", "icon": "🪐", "plays": 95},
      {"id": "game_stell_titans", "title": "Stell Titans 3D", "url": "https://mycreateforme-dotcom.github.io/Stell-Titans-3D/", "icon": "🤖", "plays": 75},
      {"id": "game_neuro_clash", "title": "Neuro Clash", "url": "https://mycreateforme-dotcom.github.io/Nuero-Clash/", "icon": "⚡", "plays": 65},
      {"id": "game_cress", "title": "Cress", "url": "https://mycreateforme-dotcom.github.io/cress/", "icon": "⚔️", "plays": 35}
    ];

    // Version key to guarantee updated play numbers override old browser storage
    const STORAGE_KEY = "playhub_games_v2";
    let games = JSON.parse(localStorage.getItem(STORAGE_KEY)) || INITIAL_GAMES;
    let isAdmin = false;
    let activeUrl = "";

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(games));
      render();
    }

    function render() {
      const total = games.reduce((s, g) => s + (parseInt(g.plays) || 0), 0);
      document.getElementById("total-count").innerText = total.toLocaleString();

      document.getElementById("grid").innerHTML = games.map(g => `
        <div class="card">
          <div>
            <div class="icon">${g.icon}</div>
            <div class="title">${g.title}</div>
            <div class="plays">${(parseInt(g.plays) || 0).toLocaleString()} plays</div>
          </div>
          <div>
            <button onclick="play('${g.id}')">▶ Play</button>
            <div class="admin-actions" style="display: ${isAdmin ? 'block' : 'none'};">
              <label>Edit Plays:</label>
              <input type="number" id="plays-input-${g.id}" value="${g.plays || 0}" min="0" />
              <button class="save-btn" style="font-size: 0.75rem; padding: 4px;" onclick="updatePlays('${g.id}')">💾 Save Plays</button>
              <button class="danger" style="margin-top: 4px; font-size: 0.75rem; padding: 4px;" onclick="removeGame('${g.id}')">🗑️ Delete</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function play(id) {
      const g = games.find(x => x.id === id);
      if (!g) return;
      g.plays = (parseInt(g.plays) || 0) + 1;
      activeUrl = g.url;
      document.getElementById("player-name").innerText = `Playing: ${g.icon} ${g.title}`;
      document.getElementById("game-frame").src = g.url;
      document.getElementById("player-section").style.display = "block";
      document.getElementById("player-section").scrollIntoView({ behavior: 'smooth' });
      save();
    }

    function updatePlays(id) {
      const input = document.getElementById(`plays-input-${id}`);
      const val = parseInt(input.value);
      const g = games.find(x => x.id === id);
      if (g && !isNaN(val) && val >= 0) {
        g.plays = val;
        save();
      }
    }

    function closePlayer() {
      document.getElementById("player-section").style.display = "none";
      document.getElementById("game-frame").src = "";
    }

    function openTab() {
      if (activeUrl) window.open(activeUrl, "_blank");
    }

    function login() {
      const u = document.getElementById("user").value;
      const p = document.getElementById("pass").value;
      if (u === "Keshav" && p === "QWERTYUIOPASDFGHJKLZXCVBNM") {
        isAdmin = true;
        document.getElementById("login-box").style.display = "none";
        document.getElementById("admin-box").style.display = "block";
        render();
      } else {
        alert("Invalid login credentials.");
      }
    }

    function logout() {
      isAdmin = false;
      document.getElementById("login-box").style.display = "block";
      document.getElementById("admin-box").style.display = "none";
      render();
    }

    function addGame() {
      const title = document.getElementById("g-title").value;
      const url = document.getElementById("g-url").value;
      const icon = document.getElementById("g-icon").value;
      const plays = parseInt(document.getElementById("g-plays").value) || 0;
      if (!title || !url) return alert("Please provide Title and URL.");
      games.unshift({ id: `game_${Date.now()}`, title, url, icon, plays });
      document.getElementById("g-title").value = "";
      document.getElementById("g-url").value = "";
      document.getElementById("g-plays").value = "0";
      save();
    }

    function removeGame(id) {
      games = games.filter(g => g.id !== id);
      save();
    }

    function resetGames() {
      games = [...INITIAL_GAMES];
      save();
    }

    render();
  </script>
</body>
</html>
