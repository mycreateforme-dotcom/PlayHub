<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayHub - 3D Games Portal</title>
  <style>
    :root {
      --bg: #0e1117;
      --card-bg: #1e2530;
      --primary: #ff4b4b;
      --text: #ffffff;
      --text-muted: #8b949e;
      --border: #30363d;
      --accent-green: #00a859;
      --accent-green-bright: #00e676;
      --accent-blue: #00f0ff;
      --accent-purple: #b000ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; perspective: 1200px; padding: 20px; }

    /* MAIN GAMES PORTAL CONTAINER */
    #main { max-width: 1200px; margin: 0 auto; padding: 20px 0; transform-style: preserve-3d; }
    
    .header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid var(--border); 
      padding-bottom: 16px; 
      margin-bottom: 24px; 
      gap: 12px; 
      flex-wrap: wrap; 
      transform: translateZ(20px);
    }
    
    .metrics-container { display: flex; gap: 20px; align-items: center; }
    .metric-box { text-align: right; }
    .metric-value { font-size: 1.3rem; font-weight: bold; color: var(--primary); text-shadow: 0 0 10px rgba(255, 75, 75, 0.4); }
    .metric-value.time { color: var(--accent-blue); text-shadow: 0 0 10px rgba(0, 240, 255, 0.4); }

    /* 3D ANIMATED CREATEFORME AD CONTAINER */
    .ad-container {
      background: linear-gradient(135deg, #151c24 0%, #0d131a 50%, #16241d 100%);
      background-size: 200% 200%;
      animation: gradientShift 6s ease infinite;
      border: 1px solid #23303d;
      border-left: 5px solid var(--accent-green);
      border-radius: 10px;
      padding: 18px 22px;
      margin-bottom: 24px;
      position: relative;
      box-shadow: 0 8px 30px rgba(0, 168, 89, 0.2);
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
      transform: translateZ(25px);
    }

    .ad-container:hover {
      transform: translateY(-5px) rotateX(2deg) rotateY(-2deg) translateZ(30px);
      box-shadow: 0 15px 35px rgba(0, 168, 89, 0.4);
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .ad-top-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .ad-brand { display: flex; align-items: center; gap: 14px; }
    .ad-logo-icon {
      width: 42px; height: 42px; background: var(--accent-green);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex; align-items: center; justify-content: center; font-weight: 900; color: #fff; font-size: 1.3rem;
      box-shadow: -4px 4px 10px rgba(0, 0, 0, 0.5); animation: logoPulse 2.5s infinite ease-in-out;
    }

    @keyframes logoPulse {
      0%, 100% { transform: scale(1) translateZ(0px); filter: drop-shadow(0 0 2px var(--accent-green)); }
      50% { transform: scale(1.08) translateZ(10px); filter: drop-shadow(0 0 12px var(--accent-green-bright)); }
    }

    .ad-title { font-size: 1.2rem; font-weight: 800; letter-spacing: 0.5px; color: #ffffff; }
    .ad-title span { color: var(--text-muted); font-weight: 500; }
    .ad-sub { font-size: 0.85rem; color: #a0aec0; margin-top: 2px; }
    .ad-badge { position: absolute; top: 6px; right: 14px; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.2px; color: #64748b; font-weight: 700; }

    .ad-btn {
      background: linear-gradient(135deg, var(--accent-green), #007a41); color: #fff;
      padding: 10px 20px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 700;
      white-space: nowrap; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 168, 89, 0.4);
    }
    .ad-btn:hover { box-shadow: 0 6px 25px rgba(0, 230, 118, 0.8); transform: translateY(-2px) scale(1.05); }

    .typewriter-box {
      margin-top: 14px; padding-top: 10px; border-top: 1px dashed rgba(255, 255, 255, 0.1);
      font-size: 0.88rem; color: var(--accent-green-bright); font-weight: 600; letter-spacing: 0.4px;
      display: flex; align-items: center; gap: 6px;
    }
    .cursor { display: inline-block; width: 7px; height: 15px; background-color: var(--accent-green-bright); margin-left: 2px; animation: blink 0.7s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* GAME DETAILS / PLAYER SECTION */
    #player-section { 
      margin-bottom: 24px; 
      background: var(--card-bg); 
      border-radius: 12px; 
      padding: 20px; 
      border: 1px solid var(--border); 
      display: none; 
      box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
      transform-style: preserve-3d;
      transform: translateZ(35px);
    }
    .player-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
    .game-detailed-info { font-size: 0.9rem; color: var(--accent-blue); display: flex; gap: 16px; font-weight: 600; margin-top: 4px; }
    .player-actions { display: flex; gap: 8px; }
    .player-actions button { width: auto; padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; }
    button.secondary { background: #161b22; border: 1px solid var(--border); }
    button.danger { background: #d73a49; }
    iframe { width: 100%; height: 70vh; border: none; border-radius: 8px; background: #000; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }

    /* 3D CARDS GRID & HOVER EFFECTS */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; transform-style: preserve-3d; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transform-style: preserve-3d;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.04) rotateX(4deg) translateZ(20px);
      border-color: var(--accent-blue);
      box-shadow: 0 20px 40px rgba(0, 240, 255, 0.3);
    }

    .icon {
      font-size: 2.8rem;
      transition: transform 0.3s ease;
      display: inline-block;
      margin-bottom: 4px;
    }

    .card:hover .icon {
      transform: scale(1.2) translateZ(25px);
    }

    .title { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .plays { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 2px; }
    .playtime { font-size: 0.75rem; color: var(--accent-blue); }
    
    .play-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary), #cc2e2e);
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 75, 75, 0.4);
      transition: all 0.2s ease;
    }

    .play-btn:hover {
      transform: translateY(-2px) translateZ(10px);
      box-shadow: 0 6px 18px rgba(255, 75, 75, 0.6);
    }

    @media (max-width: 600px) {
      .header { flex-direction: column; align-items: flex-start; }
      .metrics-container { width: 100%; justify-content: space-between; }
      .ad-top-row { flex-direction: column; align-items: flex-start; padding-top: 14px; }
      .ad-btn { width: 100%; text-align: center; }
      iframe { height: 60vh; }
    }
  </style>
</head>
<body>

  <!-- MAIN GAMES PORTAL -->
  <main id="main">
    <div class="header">
      <div>
        <h1>🎮 PlayHub Games</h1>
        <p style="color: var(--text-muted);">Select any game to view detailed statistics and launch the 3D player.</p>
      </div>
      <div class="metrics-container">
        <div class="metric-box">
          <div style="font-size: 0.75rem; color: var(--text-muted);">Total Playtime</div>
          <div class="metric-value time" id="total-time">24h 15m</div>
        </div>
        <div class="metric-box">
          <div style="font-size: 0.75rem; color: var(--text-muted);">Total Plays</div>
          <div class="metric-value" id="total-count">1,072</div>
        </div>
      </div>
    </div>

    <!-- PROMOTIONAL AD FOR CREATEFORME -->
    <div class="ad-container">
      <span class="ad-badge">Sponsored</span>
      <div class="ad-top-row">
        <div class="ad-brand">
          <div class="ad-logo-icon">C</div>
          <div>
            <div class="ad-title">CREATE<span>FORME</span></div>
            <div class="ad-sub">AI-driven creative solutions, custom interactive designs & web development.</div>
          </div>
        </div>
        <a href="https://createforme.in/" target="_blank" class="ad-btn">Visit Website ➔</a>
      </div>
      <div class="typewriter-box">
        <span>⚡ We create: </span>
        <span id="typewriter-text"></span>
        <span class="cursor"></span>
      </div>
    </div>

    <!-- SELECTED GAME DETAILS & PLAYER SECTION -->
    <section id="player-section">
      <div class="player-header">
        <div>
          <h3 id="player-name" style="font-size: 1.3rem;">Playing</h3>
          <div class="game-detailed-info" id="game-detailed-info">
            <!-- Dynamic Details Inserted Here -->
          </div>
        </div>
        <div class="player-actions">
          <button class="secondary" onclick="openTab()">⤢ Full Tab</button>
          <button class="danger" onclick="closePlayer()">✕ Close</button>
        </div>
      </div>
      <iframe 
        id="game-frame" 
        src="" 
        allow="camera; microphone; fullscreen; autoplay; display-capture; accelerometer; gyroscope" 
        allowfullscreen>
      </iframe>
    </section>

    <!-- GAMES GRID -->
    <div class="grid" id="grid"></div>
  </main>

  <script>
    // GAMES DATA WITH INDIVIDUAL PLAYS AND PLAYTIME ASSIGNMENTS
    const INITIAL_GAMES = [
      {"id": "game_chess_adapt", "title": "Chess Adapt", "url": "https://mycreateforme-dotcom.github.io/Chess-Adapt-/", "icon": "♟️", "plays": 185, "time": "4h 20m"},
      {"id": "game_stell_titans", "title": "Steel Titans 3D", "url": "https://mycreateforme-dotcom.github.io/Stell-Titans-3D/", "icon": "🤖", "plays": 150, "time": "3h 45m"},
      {"id": "game_cfm", "title": "HYPERSPACE 3D", "url": "https://mycreateforme-dotcom.github.io/GameCFM/", "icon": "🚀", "plays": 135, "time": "3h 10m"},
      {"id": "game_cyber_force_3d", "title": "Cyber Force 3D", "url": "https://mycreateforme-dotcom.github.io/CYBER-FORCE3D/", "icon": "💥", "plays": 120, "time": "2h 50m"},
      {"id": "game_cyber_glide", "title": "Cyber Glide", "url": "https://mycreateforme-dotcom.github.io/CYBER-GLIDE/", "icon": "🏄", "plays": 105, "time": "2h 15m"},
      {"id": "game_cyber_pong", "title": "Cyber Pong Overdrive", "url": "https://mycreateforme-dotcom.github.io/CYBER-PONG-OVERDRIVE/", "icon": "🏓", "plays": 90, "time": "1h 50m"},
      {"id": "game_neuro_clash", "title": "Neuro Clash", "url": "https://mycreateforme-dotcom.github.io/Nuero-Clash/", "icon": "⚡", "plays": 80, "time": "1h 35m"},
      {"id": "game_space_conquest", "title": "Space Conquest", "url": "https://mycreateforme-dotcom.github.io/Space-Conquest/", "icon": "🪐", "plays": 65, "time": "1h 10m"},
      {"id": "game_solar_man", "title": "Solar Man", "url": "https://ritugnsolarman.netlify.app/", "icon": "☀️", "plays": 50, "time": "55m"},
      {"id": "game_hand_gesture_slicer", "title": "Hand Gesture Slicer", "url": "https://mycreateforme-dotcom.github.io/Hand-Gesture-Slicer/", "icon": "🖐️", "plays": 55, "time": "1h 05m"},
      {"id": "game_cress", "title": "Cress", "url": "https://mycreateforme-dotcom.github.io/cress/", "icon": "⚔️", "plays": 37, "time": "40m"}
    ];

    const STORAGE_KEY = "playhub_games_direct_3d";
    let games = JSON.parse(localStorage.getItem(STORAGE_KEY)) || INITIAL_GAMES;
    let activeUrl = "";

    // TYPEWRITER ANIMATION FOR AD
    const services = [
      "Custom Interactive Web Applications...",
      "AI Image & Video Generation...",
      "Creative Thumbnail Design...",
      "Interactive 2D & 3D Web Games...",
      "Ghost Writing & Custom Digital Content..."
    ];
    let serviceIndex = 0, charIndex = 0, isDeleting = false;
    const typewriterElement = document.getElementById("typewriter-text");

    function typeEffect() {
      const currentService = services[serviceIndex];
      if (isDeleting) {
        typewriterElement.textContent = currentService.substring(0, charIndex - 1);
        charIndex--;
      } else {
        typewriterElement.textContent = currentService.substring(0, charIndex + 1);
        charIndex++;
      }
      let speed = isDeleting ? 40 : 80;
      if (!isDeleting && charIndex === currentService.length) {
        speed = 2000;
        isDeleting = true;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        serviceIndex = (serviceIndex + 1) % services.length;
        speed = 500;
      }
      setTimeout(typeEffect, speed);
    }
    document.addEventListener("DOMContentLoaded", typeEffect);

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(games));
      render();
    }

    function render() {
      games.sort((a, b) => (parseInt(b.plays) || 0) - (parseInt(a.plays) || 0));
      document.getElementById("total-count").innerText = "1,072";
      document.getElementById("total-time").innerText = "24h 15m";

      document.getElementById("grid").innerHTML = games.map(g => `
        <div class="card" onclick="play('${g.id}')">
          <div>
            <div class="icon">${g.icon}</div>
            <div class="title">${g.title}</div>
            <div class="plays">${(parseInt(g.plays) || 0).toLocaleString()} plays</div>
            <div class="playtime">⏱️ Play Time: ${g.time}</div>
          </div>
          <button class="play-btn" onclick="event.stopPropagation(); play('${g.id}')">▶ Play Game</button>
        </div>
      `).join('');
    }

    async function ensureCameraPermission() {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          stream.getTracks().forEach(track => track.stop());
        } catch (err) {
          console.warn("Camera access denied or prompt bypassed:", err);
        }
      }
    }

    async function play(id) {
      const g = games.find(x => x.id === id);
      if (!g) return;

      if (id === 'game_hand_gesture_slicer' || g.title.toLowerCase().includes('gesture') || g.title.toLowerCase().includes('camera')) {
        await ensureCameraPermission();
      }

      g.plays = (parseInt(g.plays) || 0) + 1;
      activeUrl = g.url;
      
      document.getElementById("player-name").innerText = `Playing: ${g.icon} ${g.title}`;
      document.getElementById("game-detailed-info").innerHTML = `
        <span>📊 Total Plays: ${(parseInt(g.plays) || 0).toLocaleString()}</span>
        <span>⏱️ Session Play Time: ${g.time}</span>
      `;
      
      document.getElementById("game-frame").src = g.url;
      document.getElementById("player-section").style.display = "block";
      document.getElementById("player-section").scrollIntoView({ behavior: 'smooth' });
      save();
    }

    function closePlayer() {
      document.getElementById("player-section").style.display = "none";
      document.getElementById("game-frame").src = "";
    }

    function openTab() {
      if (activeUrl) window.open(activeUrl, "_blank");
    }

    render();
  </script>
</body>
</html>
