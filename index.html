<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayHub - Online Games</title>
  <style>
    :root {
      --bg: #0e1117;
      --card-bg: #1e2530;
      --primary: #ff4b4b;
      --text: #ffffff;
      --text-muted: #8b949e;
      --border: #30363d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }

    #main { max-width: 1200px; margin: 0 auto; padding: 20px 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; gap: 12px; }
    .metric-value { font-size: 1.5rem; font-weight: bold; color: var(--primary); }

    #player-section { margin-bottom: 24px; background: var(--card-bg); border-radius: 8px; padding: 16px; border: 1px solid var(--border); display: none; }
    .player-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
    .player-actions { display: flex; gap: 8px; }
    .player-actions button { width: auto; padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; }
    button.secondary { background: #161b22; border: 1px solid var(--border); }
    button.danger { background: #d73a49; }
    iframe { width: 100%; height: 75vh; border: none; border-radius: 6px; background: #000; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px 12px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
    .icon { font-size: 2.2rem; }
    .title { font-size: 0.95rem; font-weight: 600; margin: 4px 0; }
    .plays { font-size: 0.8rem; color: var(--text-muted); }
    .play-btn { width: 100%; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: var(--primary); color: #fff; }

    @media (max-width: 600px) {
      .header { flex-direction: column; align-items: flex-start; }
      iframe { height: 60vh; }
    }
  </style>
</head>
<body>

  <main id="main">
    <div class="header">
      <div>
        <h1>🎮 PlayHub</h1>
        <p style="color: var(--text-muted);">Click any game to play directly in your browser.</p>
      </div>
      <div>
        <div style="font-size: 0.85rem; color: var(--text-muted);">Total Plays</div>
        <div class="metric-value" id="total-count">39,383</div>
      </div>
    </div>

    <section id="player-section">
      <div class="player-header">
        <h3 id="player-name">Playing</h3>
        <div class="player-actions">
          <button class="secondary" onclick="openTab()">⤢ Full Tab</button>
          <button class="danger" onclick="closePlayer()">✕ Close</button>
        </div>
      </div>
      <iframe 
        id="game-frame" 
        src="" 
        allow="camera; microphone; fullscreen; autoplay; display-capture; accelerometer; gyroscope" 
        allowfullscreen>
      </iframe>
    </section>

    <div class="grid" id="grid"></div>
  </main>

  <script>
    const INITIAL_GAMES = [
      {"id": "game_hand_gesture_slicer", "title": "Hand Gesture Slicer", "url": "https://mycreateforme-dotcom.github.io/Hand-Gesture-Slicer/", "icon": "🖐️", "plays": 8750},
      {"id": "game_cfm", "title": "HYPERSPACE 3D", "url": "https://mycreateforme-dotcom.github.io/GameCFM/", "icon": "🚀", "plays": 7118},
      {"id": "game_cyber_pong", "title": "Cyber Pong Overdrive", "url": "https://mycreateforme-dotcom.github.io/CYBER-PONG-OVERDRIVE/", "icon": "🏓", "plays": 5007},
      {"id": "game_cyber_glide", "title": "Cyber Glide", "url": "https://mycreateforme-dotcom.github.io/CYBER-GLIDE/", "icon": "🏄", "plays": 4344},
      {"id": "game_cyber_force_3d", "title": "Cyber Force 3D", "url": "https://mycreateforme-dotcom.github.io/CYBER-FORCE3D/", "icon": "💥", "plays": 4162},
      {"id": "game_chess_adapt", "title": "Chess Adapt", "url": "https://mycreateforme-dotcom.github.io/Chess-Adapt-/", "icon": "♟️", "plays": 3802},
      {"id": "game_stell_titans", "title": "Steel Titans 3D", "url": "https://mycreateforme-dotcom.github.io/Stell-Titans-3D/", "icon": "🤖", "plays": 3378},
      {"id": "game_neuro_clash", "title": "Neuro Clash", "url": "https://mycreateforme-dotcom.github.io/Nuero-Clash/", "icon": "⚡", "plays": 1901},
      {"id": "game_space_conquest", "title": "Space Conquest", "url": "https://mycreateforme-dotcom.github.io/Space-Conquest/", "icon": "🪐", "plays": 1719},
      {"id": "game_solar_man", "title": "Solar Man", "url": "https://ritugnsolarman.netlify.app/", "icon": "☀️", "plays": 1629},
      {"id": "game_cress", "title": "Cress", "url": "https://mycreateforme-dotcom.github.io/cress/", "icon": "⚔️", "plays": 573}
    ];

    const STORAGE_KEY = "playhub_games_v12";
    let games = JSON.parse(localStorage.getItem(STORAGE_KEY)) || INITIAL_GAMES;
    let activeUrl = "";

    function save() {
      games.sort((a, b) => (parseInt(b.plays) || 0) - (parseInt(a.plays) || 0));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(games));
      render();
    }

    function render() {
      games.sort((a, b) => (parseInt(b.plays) || 0) - (parseInt(a.plays) || 0));
      const total = games.reduce((s, g) => s + (parseInt(g.plays) || 0), 0);
      document.getElementById("total-count").innerText = total.toLocaleString();

      document.getElementById("grid").innerHTML = games.map(g => `
        <div class="card">
          <div>
            <div class="icon">${g.icon}</div>
            <div class="title">${g.title}</div>
            <div class="plays">${(parseInt(g.plays) || 0).toLocaleString()} plays</div>
          </div>
          <button class="play-btn" onclick="play('${g.id}')">▶ Play</button>
        </div>
      `).join('');
    }

    async function ensureCameraPermission() {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          stream.getTracks().forEach(track => track.stop());
        } catch (err) {
          console.warn("Camera access denied or prompt bypassed:", err);
        }
      }
    }

    async function play(id) {
      const g = games.find(x => x.id === id);
      if (!g) return;

      if (id === 'game_hand_gesture_slicer' || g.title.toLowerCase().includes('gesture') || g.title.toLowerCase().includes('camera')) {
        await ensureCameraPermission();
      }

      g.plays = (parseInt(g.plays) || 0) + 1;
      activeUrl = g.url;
      document.getElementById("player-name").innerText = `Playing: ${g.icon} ${g.title}`;
      document.getElementById("game-frame").src = g.url;
      document.getElementById("player-section").style.display = "block";
      document.getElementById("player-section").scrollIntoView({ behavior: 'smooth' });
      save();
    }

    function closePlayer() {
      document.getElementById("player-section").style.display = "none";
      document.getElementById("game-frame").src = "";
    }

    function openTab() {
      if (activeUrl) window.open(activeUrl, "_blank");
    }

    render();
  </script>
</body>
</html>
